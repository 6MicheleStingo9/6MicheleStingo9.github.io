name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "_data/cv_it.yml"
      - "assets/rendercv/design.yaml"
      - "assets/rendercv/locale.yaml"
      - "assets/rendercv/settings.yaml"
      - "assets/rendercv/settings_it.yaml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV
        run: |
          # One render per language. al-folio's original step discovered a single
          # cv.yml with `find`; with two CVs the pair (data file, settings file)
          # has to be explicit, because each settings file carries its own locale
          # and its own output filename -- rendering both through the same
          # settings would have the second overwrite the first, since RenderCV
          # builds the filename from the `name` field and the two CVs share it.
          set -euo pipefail
          render() {
            cv_file="$1"
            settings="$2"
            for f in "$cv_file" "$settings"; do
              if [ ! -f "$f" ]; then
                echo "Missing $f"
                exit 1
              fi
            done
            echo "Rendering $cv_file with $settings"
            rendercv render "$cv_file" --settings "$settings"
          }
          render _data/cv.yml    assets/rendercv/settings.yaml
          render _data/cv_it.yml assets/rendercv/settings_it.yaml
          rm -f assets/rendercv/rendercv_output/*.typ

      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "chore: render the latest CV"
          git push
