# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Vendored and generated files, kept in step with .prettierignore so the two
# tools do not fight over third-party assets.
exclude: |
  (?x)^(
    .*\.min\.(css|js)|
    .*\.map|
    assets/css/main\.scss|
    assets/js/distillpub/.*|
    assets/js/search/.*|
    assets/plotly/demo\.html|
    lighthouse_results/.*|
    _sass/font-awesome/.*|
    _scripts/.*|
    _data/citations\.yml
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # Default is 500 kB, too tight for high-resolution scans and plates.
        args: ["--maxkb=2000"]
