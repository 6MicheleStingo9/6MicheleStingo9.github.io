# La lingua del PDF: nomi dei mesi, "presente", "Ultimo aggiornamento".
# Deve stare qui dentro. RenderCV 2.8 accetta anche
# settings.render_command.locale come percorso a un file esterno, ne verifica
# perfino l'esistenza, e poi lo ignora: verificato rendendo lo stesso CV nei due
# modi: con il file esterno le date uscivano "Sept 2023" e "present".
locale:
  language: italian

# Il tema del PDF italiano. Deve stare qui per la stessa ragione del locale:
# RenderCV 2.8 non applica i file esterni passati via settings.render_command.
# L'unica differenza da assets/rendercv/design.yaml è la larghezza della colonna
# dei titoli di studio: il valore predefinito di 1cm è tagliato su "PhD" e "MA",
# e spezzava "Dottorato" e "Laurea magistrale" a metà parola.
design:
  theme: classic
  page:
    size: a4
    show_footer: false
    show_top_note: false
  entries:
    degree_width: 3.2cm
