# Il CV italiano. Non è una traduzione applicata al volo su _data/cv.yml: è un
# secondo file con la stessa forma, perché RenderCV compone il PDF dalle chiavi
# di questo file e i nomi delle sezioni finiscono nelle intestazioni del PDF.
# I nomi delle sezioni sono dichiarati anche in _data/lang/it.yml, sotto
# cv.section_keys, perché _layouts/cv.liquid li usa per scegliere come rendere
# ciascuna sezione.
#
# Restano in inglese di proposito: le pubblicazioni (i titoli dei paper e gli
# editori sono quelli veri), la qualifica in Activa Digital (è il titolo che
# Michele ricopre) e i termini tecnici nelle competenze.
