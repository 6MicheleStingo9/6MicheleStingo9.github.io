  sections:
    Profilo:
      - Dottore di ricerca in linguistica computazionale, specializzato in elaborazione del linguaggio naturale, modelli linguistici di grandi dimensioni e sistemi multi-agente intelligenti. La mia ricerca riguarda gli agenti cognitivi, le architetture di orchestrazione e la rappresentazione della conoscenza attraverso ontologie e grafi, con l'obiettivo di integrare la conoscenza strutturata con gli LLM per ottenere ragionamenti e decisioni più affidabili. Lavoro abitualmente con framework come LangGraph e LangChain e seguo da vicino gli ecosistemi open source, fra cui Hugging Face e Ollama, per lo sviluppo di applicazioni scalabili basate su LLM. Mi occupo inoltre di prompt engineering avanzato, coordinamento fra agenti e progettazione di sistemi di intelligenza artificiale strutturati, capaci di ragionamento complesso, pianificazione e comunicazione fra agenti.
    Esperienza:
      - company: "Activa Digital"
        position: "Senior Research and Development Scientist"
        location: "Roma, Italia"
        start_date: "2023-09"
        end_date: "present"
        summary: "Come Senior Research and Development Scientist mi occupo della progettazione di agenti cognitivi e di architetture multi-agente per applicazioni avanzate di intelligenza artificiale. Il mio lavoro tiene insieme orchestrazione di LLM, rappresentazione della conoscenza e ragionamento strutturato, con particolare attenzione all'integrazione di conoscenza a grafo e agli approcci simbolico-subsimbolici dentro i sistemi intelligenti. Contribuisco inoltre alla pianificazione della ricerca, al disegno sperimentale e alle attività di ricerca e sviluppo orientate all'innovazione."
        highlights:
          - "Coordinamento del gruppo di ricerca e sviluppo, con partecipazione alla
            richiesta di finanziamenti e al disegno sperimentale."
          - "Sviluppo di agenti cognitivi e sistemi multi-agente con i framework
            LangGraph e LangChain."
          - "Progettazione di schemi di orchestrazione e coordinamento per architetture
            basate su LLM, per abilitare ragionamento complesso, pianificazione e
            comunicazione fra agenti."
          - "Uso di strumenti come Protégé e Neo4j per la rappresentazione della
            conoscenza e l'integrazione simbolico-subsimbolica."
          - "Integrazione di ontologie e rappresentazioni a grafo per migliorare le
            capacità di ragionamento e i processi decisionali dei sistemi di
            intelligenza artificiale."

      - company: "Luo"
        position: "Linguista computazionale, analista software e sviluppatore front-end"
        location: "Roma, Italia"
        start_date: "2017-08"
        end_date: "2023-09"
        summary: "In Luo ho lavorato fra linguistica computazionale, analisi software e sviluppo front-end, contribuendo sia alla ricerca orientata all'NLP sia allo sviluppo applicativo. Il ruolo comprendeva la creazione di risorse linguistiche, la valutazione di pipeline di NLP, l'ingegneria ontologica e lo sviluppo di soluzioni mobili e web."
        highlights:
          - "Sviluppo di applicazioni mobili con Flutter e di applicazioni web con Angular."
          - "Sviluppo e gestione di risorse ontologiche in OWL, XML e JSON."
          - "Valutazione di strumenti di NLP quali lemmatizzatori, POS tagger e parser
            sintattici, e creazione di corpora linguistici e dizionari elettronici."

      - company: "Università degli Studi di Salerno"
        position: "Dottorando di ricerca e assistente alla didattica"
        location: "Salerno, Italia"
        start_date: "2016-10"
        end_date: "2020-03"
        summary: "Come dottorando di ricerca e assistente alla didattica ho svolto attività di ricerca in linguistica computazionale ed elaborazione del linguaggio naturale, affiancandole al supporto alla didattica e alla supervisione degli studenti. Il lavoro era rivolto al miglioramento delle metodologie di NLP e allo sviluppo di risorse linguistiche per contesti sia accademici sia applicativi."
        highlights:
          - "Supporto alla didattica e tutoraggio di studenti triennali e magistrali
            nei corsi di linguistica computazionale e NLP."
          - "Ricerca su pipeline di NLP e sugli aspetti pragmatici dei sistemi
            linguistici guidati dall'intelligenza artificiale."
          - "Stesura di progetti di finanziamento e gestione di iniziative di ricerca
            del dipartimento."

