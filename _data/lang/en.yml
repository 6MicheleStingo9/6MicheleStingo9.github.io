# Interface strings. Keys name what the string is for, not what it says.
# Looked up as site.data.lang[page.lang].group.key — page.lang is guaranteed
# by the defaults rules in _config.yml.

nav:
  toggle: Toggle navigation
  search: Search
  theme: Change theme
  other_code: IT
  switch: Read this page in Italian
  unavailable: Not available in Italian yet

post:
  created_on: Created on
  by: by
  last_updated_on: last updated on

related:
  heading: Enjoy Reading This Article?
  intro: "Here are some more articles you might like to read next:"
  subscribe: "Subscribe to be notified of future articles:"

# The note under the social icons on the about page. Only email and LinkedIn are
# ways of reaching me; the other icons are profiles and files, not inboxes, so
# the note names the two and says nothing about the rest.
about:
  contact_note: Email or LinkedIn — I answer quickly on both.
  news: "news"
  latest_posts: "latest posts"
  selected_publications: "selected publications"
  rss: "Lost&Found — RSS feed"
  avatar_alt: "Michele Stingo"

blog:
  name: Lost&Found
  description: notes for the curious and the easily distracted

# Month names, used to build dates: Ruby's strftime only knows English, so the
# name is looked up here and the pieces are assembled in the date include.
months_long: [January, February, March, April, May, June, July, August, September, October, November, December]
months_short: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]

graph:
  sources: sources
  fit: fit
  hint: "scroll = zoom · drag background = pan · drag a node to move it"
  full_map: open full map ↗
  manifesto: manifesto
  note: note
  source: source

common:
  references: References
  contents: Contents
  impressum: Impressum

# Section headings of the CV page. Note that "references" here means referees,
# which is a different word from the bibliography one above.
cv:
